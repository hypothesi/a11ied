StylesPath = styles
MinAlertLevel = suggestion

[formats]
astro = html

# Scoped to the files this repo's docs-writing agent owns and has checked clean.
# packages/docs/src/pages/reference/mcp.astro, guides/agents.astro, and
# guides/agent-skill.astro are excluded: another agent owns their prose.
[{README.md,packages/cli/README.md}]
BasedOnStyles = plain-english

[internal-docs/{cli-purpose-audit.md,maintainer-release-checklist.md,cli-low-level-guide.md}]
BasedOnStyles = plain-english

[internal-docs/releases/v0.1.0-readiness.md]
BasedOnStyles = plain-english

[packages/docs/src/pages/{applicability,coverage,index,install,quickstart,targets}.astro]
BasedOnStyles = plain-english

[packages/docs/src/pages/guides/{ci,recording,screen-reader,scripting,testing,troubleshooting,violations}.astro]
BasedOnStyles = plain-english

[packages/docs/src/pages/reference/{api,cli,wcag-data}.astro]
BasedOnStyles = plain-english
