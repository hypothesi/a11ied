# British spellings, and the American spelling to write instead. Blocked, not reported.
#
# Generated by bin/build-british.mjs. Run `npm run build:british` to rebuild it; do not
# hand-edit. A one-off exception belongs in styles/plain-english/substitutions.yml, which
# is hand-written, and a Briticism that is not a spelling variant belongs there too.
#
# In Markdown, vale skips fenced blocks and inline code spans, so an API name spelled the
# British way passes in backticks. A source comment has no such escape: vale reads the
# whole comment, backticks and all.
#
