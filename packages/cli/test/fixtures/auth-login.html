<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Authentication login demo</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
      }

      form {
        display: grid;
        gap: 1rem;
        max-width: 24rem;
      }

      label {
        display: grid;
        gap: 0.25rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sign in</h1>
      <p>Enter your email address and password to access your account.</p>
      <form aria-label="Login form">
        <label>
          Email
          <input type="email" name="email" autocomplete="username" />
        </label>
        <label>
          Password
          <input type="password" name="password" autocomplete="current-password" />
        </label>
        <button type="submit">Sign in</button>
      </form>
      <p>Use your two-factor verification code if prompted after sign in.</p>
    </main>
  </body>
</html>
