<!doctype html>
<html lang="en">
   <head>
      <meta charset="utf-8" />
      <title>Structure page</title>
   </head>
   <body>
      <header>
         <h1>Structure page</h1>
         <nav aria-label="Site">
            <a href="/about">About us</a>
            <a href="/learn">Learn more</a>
         </nav>
      </header>
      <main>
         <h2>Products</h2>
         <p>A short paragraph about the products.</p>
         <img src="/logo.png" alt="Company logo" />
         <h3>Pricing</h3>
         <table>
            <caption>
               Plans
            </caption>
            <thead>
               <tr>
                  <th scope="col">Plan</th>
                  <th scope="col">Price</th>
                  <th scope="col">Seats</th>
               </tr>
            </thead>
            <tbody>
               <tr>
                  <th scope="row">Starter</th>
                  <td>10</td>
                  <td>1</td>
               </tr>
               <tr>
                  <th scope="row">Team</th>
                  <td>50</td>
                  <td>5</td>
               </tr>
            </tbody>
         </table>
         <h2>Sign up</h2>
         <form>
            <label>
               Email
               <input type="email" name="email" />
            </label>
            <label>
               <input type="checkbox" name="terms" />
               Accept the terms
            </label>
            <button type="submit">Create account</button>
         </form>
         <ul>
            <li>First point</li>
            <li>Second point</li>
         </ul>
         <section aria-label="Notes">
            <p>Region text.</p>
         </section>
      </main>
      <footer>
         <p>Footer text.</p>
      </footer>
   </body>
</html>
