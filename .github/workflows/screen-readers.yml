name: screen-readers

# Real VoiceOver and NVDA runs are slower and less predictable than the rest of the
# suite, so they do not gate pull requests. They run on every push to master, once a
# day, and on demand.
on:
   push:
      branches:
         - master
   schedule:
      - cron: 0 11 * * *
   workflow_dispatch:

permissions:
   contents: read

jobs:
   voiceover:
      name: VoiceOver smoke
      runs-on: macos-latest
      timeout-minutes: 20
      steps:
         - name: Check out repo
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Build workspaces
           run: npm run build

         - name: Install Chromium for browser automation
           run: npx playwright install chromium

         - name: Set up VoiceOver
           uses: guidepup/setup-action@0.21.0

         - name: Install Guidepup VoiceOver assets
           run: node packages/cli/dist/cli.js setup --skip-setup

         - name: Screen reader smoke test
           run: npm run smoke:sr

   nvda:
      name: NVDA smoke
      runs-on: windows-latest
      timeout-minutes: 20
      steps:
         - name: Check out repo
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Build workspaces
           run: npm run build

         - name: Install Chromium for browser automation
           run: npx playwright install chromium

         - name: Set up NVDA
           uses: guidepup/setup-action@0.21.0

         - name: Install Guidepup NVDA assets
           run: node packages/cli/dist/cli.js setup

         - name: Screen reader smoke test
           run: npm run smoke:sr
