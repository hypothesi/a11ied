name: ci

on:
   pull_request:
   push:
      branches:
         - master

permissions:
   contents: read

jobs:
   standards:
      runs-on: ubuntu-latest
      steps:
         - name: Check out repo
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: npm

         - name: Install dependencies
           run: npm ci --ignore-scripts

         - name: Data validation
           run: npm run wcag:validate

         - name: Standards
           run: npm run standards

         - name: Prose
           run: npm run prose

   test:
      runs-on: ubuntu-latest
      steps:
         - name: Check out repo
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: npm

         - name: Install dependencies
           run: npm ci --ignore-scripts

         - name: Build
           run: npm run build

         - name: Test
           run: npm test

   pack:
      needs:
         - standards
         - test
      runs-on: ubuntu-latest
      steps:
         - name: Check out repo
           uses: actions/checkout@v7

         - name: Set up Node.js
           uses: actions/setup-node@v7
           with:
              node-version: 24
              cache: npm

         - name: Install dependencies
           run: npm ci --ignore-scripts

         - name: Pack public workspaces
           run: npm run pack:check
