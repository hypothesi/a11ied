name: ci

on:
   pull_request:
   push:
      branches:
         - main

jobs:
   verify:
      runs-on: ubuntu-latest
      steps:
         - name: Check out repo
           uses: actions/checkout@v4

         - name: Set up Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 24
              cache: npm

         - name: Install dependencies
           run: npm ci

         - name: Data validation
           run: npm run wcag:validate

         - name: Contract tests
           run: npx vitest run packages/contracts/src/index.test.ts packages/contracts/src/index.verification.test.ts

         - name: CLI smoke tests
           run: npx vitest run packages/cli/src/program.test.ts packages/cli/src/command-handlers-wcag.test.ts packages/cli/src/command-handlers-drive.test.ts

         - name: Virtual-target verification smoke tests
           run: npx vitest run packages/cli/src/command-handlers-verify.test.ts packages/cli/src/command-handlers-verify-level.test.ts packages/core/src/verification-runtime.test.ts

         - name: Standards (lint, typecheck, build, test)
           run: npm run standards
